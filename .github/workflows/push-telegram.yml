name: Push Telegram Notify

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "::error::TELEGRAM_BOT_TOKEN secret is not set"; exit 1; fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then echo "::error::TELEGRAM_CHAT_ID secret is not set"; exit 1; fi
          echo "Both secrets are set."

      - name: Detect new daily folder
        id: find
        run: |
          # git이 비ASCII(한글) 경로를 escape하지 않도록 설정 (이게 없으면 "daily/..." 로 quoting 됨)
          git config core.quotepath off
          FOLDER=""
          COUNT=0
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            DIFF_OUTPUT=$(git diff --name-only HEAD~1 HEAD)
            echo "--- git diff output ---"
            echo "$DIFF_OUTPUT"
            echo "--- end diff ---"
            FOLDER=$(echo "$DIFF_OUTPUT" | grep -oE '^daily/[^/]+' | sort -u | head -1 || true)
          fi
          if [ -n "$FOLDER" ] && [ -d "$FOLDER/png" ]; then
            COUNT=$(ls "$FOLDER/png/"*.mp4 2>/dev/null | wc -l || echo 0)
          else
            FOLDER=""
          fi
          echo "Detected folder: '$FOLDER' (count: $COUNT)"
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Send text notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          FOLDER: ${{ steps.find.outputs.folder }}
          COUNT: ${{ steps.find.outputs.count }}
        run: |
          NL=$'\n'
          if [ -n "$FOLDER" ]; then
            MESSAGE="새 카드뉴스가 올라왔습니다 (${COUNT}장)${NL}${NL}폴더: ${FOLDER}${NL}커밋: ${COMMIT_MESSAGE}${NL}링크: ${COMMIT_URL}${NL}${NL}로컬 PC는 09:15에 자동 git pull 됩니다.${NL}이미지는 잠시 후 이어서 전송됩니다."
          else
            MESSAGE="repo에 push 됐습니다 (카드뉴스 아님)${NL}${NL}커밋: ${COMMIT_MESSAGE}${NL}작성자: ${COMMIT_AUTHOR}${NL}링크: ${COMMIT_URL}"
          fi
          RESP=$(curl -sS -w "\nHTTP_CODE:%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}")
          echo "Telegram response: $RESP"
          HTTP_CODE=$(echo "$RESP" | tail -1 | sed 's/HTTP_CODE://')
          if [ "$HTTP_CODE" != "200" ]; then echo "::error::Telegram sendMessage failed with HTTP $HTTP_CODE"; exit 1; fi

      - name: Concat all card videos into one + sendVideo (묶음 1개 영상)
        if: steps.find.outputs.folder != '' && steps.find.outputs.count != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOLDER: ${{ steps.find.outputs.folder }}
        run: |
          # 사용자 요청: 영상을 묶음으로 (개별 알림 폭탄 방지 + sendMediaGroup silently fail 우회)
          # 10개 mp4 → ffmpeg concat → 1개 60초 영상 → sendVideo 1번 → 알림 1번 + 묶음
          mapfile -t FILES < <(ls "${FOLDER}/png/"*.mp4 2>/dev/null | sort -V)
          TOTAL=${#FILES[@]}
          if [ "$TOTAL" -eq 0 ]; then echo "No mp4 files found, skipping."; exit 0; fi
          echo "Concatenating $TOTAL videos into one..."
          # cwd를 png 디렉토리로 옮겨서 상대 경로 단순화 (ffmpeg concat이 한글 경로 안전)
          pushd "${FOLDER}/png" > /dev/null
          ls *.mp4 | sort -V | sed "s/.*/file '&'/" > _concat.txt
          echo "--- concat list ---"
          cat _concat.txt
          echo "--- end ---"
          # -c copy 생략하고 항상 재인코딩 (codec 일관성 보장)
          ffmpeg -y -loglevel error -f concat -safe 0 -i _concat.txt \
            -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p -vf "scale=1080:1350" \
            -an -movflags +faststart _all.mp4 2>&1 | tail -20
          FFMPEG_EXIT=${PIPESTATUS[0]}
          popd > /dev/null
          if [ "$FFMPEG_EXIT" != "0" ]; then
            echo "::error::ffmpeg concat failed (exit $FFMPEG_EXIT)"
            exit 1
          fi
          OUT_MP4="${FOLDER}/png/_all.mp4"
          SIZE=$(stat -c%s "$OUT_MP4" 2>/dev/null || echo 0)
          DURATION=$((TOTAL * 6))
          echo "Combined video: ${SIZE} bytes, ${DURATION}s"
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::concat output too small ($SIZE bytes)"
            exit 1
          fi
          if [ "$SIZE" -gt 49000000 ]; then
            echo "::warning::combined video > 49MB ($SIZE), telegram may reject (bot 50MB limit)"
          fi
          # sendVideo 1번 → 알림 1번 + 묶음 형태로 카드 10장 60초 영상
          CAPTION="카드뉴스 ${TOTAL}장 (총 ${DURATION}초, 카드별 6초씩)"
          echo "Sending combined video to telegram..."
          RESP=$(curl -sS -w "\nHTTP_CODE:%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@${OUT_MP4}" \
            -F "supports_streaming=true" \
            -F "width=1080" -F "height=1350" -F "duration=${DURATION}" \
            -F "caption=${CAPTION}")
          HTTP_CODE=$(echo "$RESP" | tail -1 | sed 's/HTTP_CODE://')
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $HTTP_CODE | $(echo "$BODY" | head -c 300)"
          # 정리
          rm -f "${FOLDER}/png/_concat.txt" "$OUT_MP4"
          if [ "$HTTP_CODE" != "200" ]; then echo "::error::sendVideo combined failed HTTP $HTTP_CODE"; exit 1; fi
          echo "Combined video sent successfully."

      - name: Send caption text (더보기)
        if: steps.find.outputs.folder != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOLDER: ${{ steps.find.outputs.folder }}
        run: |
          # 폴더에서 인스타_더보기*.txt 또는 더보기*.txt 찾기
          CAPTION_FILE=$(find "${FOLDER}" -maxdepth 1 -name "*더보기*.txt" 2>/dev/null | head -1)
          if [ -z "$CAPTION_FILE" ] || [ ! -f "$CAPTION_FILE" ]; then
            echo "No caption file found in $FOLDER, skipping."
            exit 0
          fi
          echo "Caption file: $CAPTION_FILE"
          # Python으로 분할 전송 (Telegram 4096자 제한)
          export CAPTION_FILE
          python3 - <<'PYEOF'
          import os, sys, urllib.parse, urllib.request

          cap = os.environ['CAPTION_FILE']
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']

          with open(cap, encoding='utf-8') as f:
              content = f.read().rstrip()

          # 4000자씩 분할 (Telegram 4096자 제한, 여유 96자)
          chunks = []
          current = ''
          for line in content.split('\n'):
              if len(current) + len(line) + 1 > 4000:
                  if current:
                      chunks.append(current)
                  current = line
              else:
                  current = current + '\n' + line if current else line
          if current:
              chunks.append(current)

          total = len(chunks)
          print(f'Sending {total} chunk(s), total {len(content)} chars')

          for i, chunk in enumerate(chunks, 1):
              prefix = f'더보기 ({i}/{total})\n\n' if total > 1 else '더보기\n\n'
              text = prefix + chunk
              data = urllib.parse.urlencode({'chat_id': chat_id, 'text': text}).encode()
              req = urllib.request.Request(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  data=data, method='POST',
              )
              try:
                  resp = urllib.request.urlopen(req)
                  body = resp.read().decode()
                  print(f'Chunk {i}/{total}: HTTP {resp.status}')
                  if resp.status != 200:
                      print(f'::error::Chunk {i} failed: {body}')
                      sys.exit(1)
              except Exception as e:
                  print(f'::error::Chunk {i} exception: {e}')
                  sys.exit(1)
          print('All chunks sent.')
          PYEOF
