<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 2/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="summary">
      <div class="summary__head">
        <div class="summary__title">한 주의 핵심 수치</div>
        <div class="summary__date">2026.05.08.</div>
      </div>

      <div class="summary__list">
        <div class="stat">
          <div class="num-chip">01</div>
          <div class="stat__body">
            <div class="stat__label">S&amp;P 500</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">7,365</span></span>
              <span class="delta">5월 6일 사상 최고치 기록</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">02</div>
          <div class="stat__body">
            <div class="stat__label">WTI 원유</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">$95</span></span>
              <span class="delta">5월 7일 변동 폭 확대</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">03</div>
          <div class="stat__body">
            <div class="stat__label">미국 가구당 관세 부담</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">$1,500</span></span>
              <span class="delta">2026년 평균 추산</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">04</div>
          <div class="stat__body">
            <div class="stat__label">BTC ETF 주간 순유입</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">$1.0B+</span></span>
              <span class="delta">1월 이후 첫 주간 $10억 통과</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
