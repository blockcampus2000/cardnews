        </div>

        <div class="point__item">
          <div class="point__main">
            5월 7일 이란 항구 폭발음 보도로<br/>
            <span class="hl">위험자산 일시 후퇴</span>
          </div>
          <div class="point__sub">미군이 이란 유조선을 공격, 미사일 보복이 있었다는 이란 국영방송 보도가 함께 나왔다</div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
