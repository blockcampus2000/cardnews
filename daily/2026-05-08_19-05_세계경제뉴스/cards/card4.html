<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 4/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="point">
      <div class="point__date">포인트 2 / 4</div>
      <div class="point__page">2026.05.08</div>

      <div class="point__title">
        <div class="accent-bar"></div>
        <span>S&amp;P 500 <span class="hl">사상 최고 갱신</span></span>
      </div>

      <div class="point__list">
        <div class="point__item">
          <div class="point__main">
            5월 6일 S&amp;P 500 종가<br/>
            <span class="hl">7,365.12 (+1.46%)</span>로 사상 최고
          </div>
          <div class="point__sub">미·이란 핵 협상 진전 보도가 동력으로 인용됐다</div>
        </div>

        <div class="point__item">
          <div class="point__main">
            5주 연속 상승<br/>
            <span class="hl">1월 이후 최장 기록</span>
          </div>
          <div class="point__sub">위험자산 전반의 회복세가 함께 거론된다</div>
        </div>

        <div class="point__item">
          <div class="point__main">
            5월 7일부터 <span class="hl">고점 유지가 흔들리는 흐름</span>
          </div>
          <div class="point__sub">MSCI 아시아태평양 지수는 1.1% 하락,<br/>이란발 충돌 보도에 변동 폭이 확대됐다</div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
