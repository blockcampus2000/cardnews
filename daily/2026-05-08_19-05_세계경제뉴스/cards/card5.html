<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 5/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="point">
      <div class="point__date">포인트 3 / 4</div>
      <div class="point__page">2026.05.08</div>

      <div class="point__title">
        <div class="accent-bar"></div>
        <span>트럼프 관세 효과 <span class="hl">본격 가시화</span></span>
      </div>

      <div class="point__list">
        <div class="point__item">
          <div class="point__main">
            트럼프 관세는 <span class="hl">1993년 이후 최대</span><br/>
            GDP 비중의 증세로 집계됐다
          </div>
          <div class="point__sub">미국 가구당 2026년 평균 부담은 약 $1,500로 추산된다</div>
        </div>

        <div class="point__item">
          <div class="point__main">
            파월 의장<br/>
            <span class="hl">"소비자 가격에 효과 명확히 가시화"</span>
          </div>
          <div class="point__sub">관세 영향이 향후 수개월에 걸쳐 누적될 가능성을 함께 언급</div>
        </div>

        <div class="point__item">
          <div class="point__main">
            5월 15일 <span class="hl">파월 임기 종료</span><br/>
            후임 케빈 워시 거론
          </div>
          <div class="point__sub">정책 방향 변수와 관세 인플레이션 압력이 동시에 시장에서 인용된다</div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
