<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 6/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="point">
      <div class="point__date">포인트 4 / 4</div>
      <div class="point__page">2026.05.08</div>

      <div class="point__title">
        <div class="accent-bar"></div>
        <span>위험자산 회복 신호<br/><span class="hl hl--strong">코인 ETF로 자금 환류</span></span>
      </div>

      <div class="point__list">
        <div class="point__item">
          <div class="point__main">
            미국 현물 BTC ETF 4월 순유입<br/>
            <span class="hl">$2.44B (10월 이후 최대)</span>
          </div>
          <div class="point__sub">월간 단위로 자금 흐름이 회복세를 보였다고 보고됐다</div>
        </div>

        <div class="point__item">
          <div class="point__main">
            주간 순유입 <span class="hl">$10억 통과</span><br/>
            1월 이후 처음으로 집계
          </div>
          <div class="point__sub">5월 1일 단일일 순유입 $630M가 함께 보고됐다</div>
        </div>

        <div class="point__item">
          <div class="point__main">
            BlackRock IBIT 누적 보유<br/>
            <span class="hl">약 812K BTC (공급량 3.8%)</span>
          </div>
          <div class="point__sub">유로존 GDP 0.1% 성장 둔화·인플레 3.0% 속에서도<br/>위험자산 자금 환류 흐름이 함께 거론된다</div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
