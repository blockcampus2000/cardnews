<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 2/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="summary">
      <div class="summary__head">
        <div class="summary__title">한눈에 보기</div>
        <div class="summary__date">2026.05.18.</div>
      </div>

      <div class="summary__list">
        <div class="stat">
          <div class="num-chip">01</div>
          <div class="stat__body">
            <div class="stat__label">개전일</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">2026.02.28</span></span>
              <span class="delta">미국·이스라엘의 이란 공습 개시</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">02</div>
          <div class="stat__body">
            <div class="stat__label">WTI 원유 (5월 16일)</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">$106</span></span>
              <span class="delta">주간 +11%, 개전 전 대비 +50% 이상</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">03</div>
          <div class="stat__body">
            <div class="stat__label">하루 공급 차질 (3월 12일 집계)</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">1,000만 배럴</span></span>
              <span class="delta">IEA 역대 최대 공급 충격 판정</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">04</div>
          <div class="stat__body">
            <div class="stat__label">S&amp;P 500 (5월 10일 종가)</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">7,412</span></span>
              <span class="delta">유가 충격에도 사상 최고치 경신</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
