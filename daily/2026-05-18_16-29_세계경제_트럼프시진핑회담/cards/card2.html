<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 2/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="summary">
      <div class="summary__head">
        <div class="summary__title">한눈에 보기</div>
        <div class="summary__date">2026.05.18.</div>
      </div>

      <div class="summary__list">
        <div class="stat">
          <div class="num-chip">01</div>
          <div class="stat__body">
            <div class="stat__label">회담 일자</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">2026.05.13~14</span></span>
              <span class="delta">9년 만의 미국 대통령 베이징 방문</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">02</div>
          <div class="stat__body">
            <div class="stat__label">보잉 항공기 (트럼프 발표)</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">200대</span></span>
              <span class="delta">中 공식 발표엔 구체 수치 없음, 보잉 -3.8%</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">03</div>
          <div class="stat__body">
            <div class="stat__label">S&amp;P 500 선물 반응 (5월 15일)</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">-1.0%</span></span>
              <span class="delta">다우 선물 -0.6%, 나스닥 선물 -1.4%</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">04</div>
          <div class="stat__body">
            <div class="stat__label">공동성명</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">채택 안됨</span></span>
              <span class="delta">양측이 합의 내용에 대해 서로 다른 발표</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
