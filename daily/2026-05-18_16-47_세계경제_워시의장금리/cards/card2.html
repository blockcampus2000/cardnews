<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 2/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="summary">
      <div class="summary__head">
        <div class="summary__title">한눈에 보기</div>
        <div class="summary__date">2026.05.18.</div>
      </div>

      <div class="summary__list">
        <div class="stat">
          <div class="num-chip">01</div>
          <div class="stat__body">
            <div class="stat__label">워시 공식 취임일</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">2026.05.15</span></span>
              <span class="delta">파월 임기 종료 후 11번째 연준 의장 취임</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">02</div>
          <div class="stat__body">
            <div class="stat__label">4월 CPI (소비자물가, 전년 대비)</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">3.8%</span></span>
              <span class="delta">3년 만의 최고, 연준 목표 2% 크게 상회</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">03</div>
          <div class="stat__body">
            <div class="stat__label">30년물 미국 국채금리 (5월 15일)</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">5.12%</span></span>
              <span class="delta">1년 만의 최고, 10년물은 4.58%까지 급등</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">04</div>
          <div class="stat__body">
            <div class="stat__label">S&amp;P 500 반응</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">-1.22%</span></span>
              <span class="delta">나스닥 -1.53%, 다우 -1.06% 동반 하락</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
