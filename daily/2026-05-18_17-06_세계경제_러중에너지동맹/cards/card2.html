<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 2/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="summary">
      <div class="summary__head">
        <div class="summary__title">한눈에 보기</div>
        <div class="summary__date">2026.05.18.</div>
      </div>

      <div class="summary__list">
        <div class="stat">
          <div class="num-chip">01</div>
          <div class="stat__body">
            <div class="stat__label">푸틴 베이징 방문 일정</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">5/19~20</span></span>
              <span class="delta">트럼프 방중(5/14~15) 나흘 뒤 방문</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">02</div>
          <div class="stat__body">
            <div class="stat__label">시베리아의 힘 1 연간 공급량</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">38bcm</span></span>
              <span class="delta">2025년 완전 가동, 중국행 천연가스 최대 파이프라인</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">03</div>
          <div class="stat__body">
            <div class="stat__label">러-중 연간 원유 교역량</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">3천만t</span></span>
              <span class="delta">중국은 러시아 최대 원유 수출국으로 구조적 정착</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">04</div>
          <div class="stat__body">
            <div class="stat__label">시 주석-푸틴 정상 접촉 횟수</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">20회</span></span>
              <span class="delta">2022년 2월부터 2026년 5월까지 만남·통화 합산</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
