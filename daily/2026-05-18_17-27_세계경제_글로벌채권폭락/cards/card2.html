<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 2/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="summary">
      <div class="summary__head">
        <div class="summary__title">한눈에 보기</div>
        <div class="summary__date">2026.05.18.</div>
      </div>

      <div class="summary__list">
        <div class="stat">
          <div class="num-chip">01</div>
          <div class="stat__body">
            <div class="stat__label">미국 10년 국채 금리</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">4.60%</span></span>
              <span class="delta">주간 상승폭, 2025년 4월 이후 최대</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">02</div>
          <div class="stat__body">
            <div class="stat__label">미국 30년 국채 금리</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">5.13%</span></span>
              <span class="delta">2007년 이후 최고치 돌파</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">03</div>
          <div class="stat__body">
            <div class="stat__label">일본 30년 국채 금리</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">4.00%</span></span>
              <span class="delta">1999년 첫 발행 이후 최초 돌파</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">04</div>
          <div class="stat__body">
            <div class="stat__label">영국 10년 국채(길트) 금리</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">5.17%</span></span>
              <span class="delta">2008년 이후 최고치, 30년물도 28년 고점</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
