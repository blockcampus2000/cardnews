<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 2/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="summary">
      <div class="summary__head">
        <div class="summary__title">한눈에 보기</div>
        <div class="summary__date">2026.05.18.</div>
      </div>

      <div class="summary__list">
        <div class="stat">
          <div class="num-chip">01</div>
          <div class="stat__body">
            <div class="stat__label">미국 30년 국채 수익률</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">5.12%</span></span>
              <span class="delta">2026년 최고, 2025년 5월 이후 최고치</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">02</div>
          <div class="stat__body">
            <div class="stat__label">미국 10년 국채 수익률</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">4.63%</span></span>
              <span class="delta">5/18 기준 2026년 신고가, 1년 만에 최고</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">03</div>
          <div class="stat__body">
            <div class="stat__label">주간 미국 국채 발행액</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">$691B</span></span>
              <span class="delta">5월 15일 한 주간 미 정부 발행, 수급 압박</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">04</div>
          <div class="stat__body">
            <div class="stat__label">연내 금리 인상 시장 기대</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">50%+</span></span>
              <span class="delta">4월까지 1% 수준이던 인상 기대가 한 달 만에 역전</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
