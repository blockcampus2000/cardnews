<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 2/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="summary">
      <div class="summary__head">
        <div class="summary__title">한눈에 보기</div>
        <div class="summary__date">2026.05.18.</div>
      </div>

      <div class="summary__list">
        <div class="stat">
          <div class="num-chip">01</div>
          <div class="stat__body">
            <div class="stat__label">WTI 원유 가격</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">$107</span></span>
              <span class="delta">5/18 기준, 봉쇄 이후 70% 이상 급등</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">02</div>
          <div class="stat__body">
            <div class="stat__label">Brent 원유 가격</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">$110</span></span>
              <span class="delta">5/18 기준, 전주 대비 8% 추가 상승</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">03</div>
          <div class="stat__body">
            <div class="stat__label">호르무즈 해협 통과 비중</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">20%</span></span>
              <span class="delta">전 세계 해상 석유 교역량 중 통과 비율</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">04</div>
          <div class="stat__body">
            <div class="stat__label">IEA 글로벌 공급 감소 전망</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">-3.9%</span></span>
              <span class="delta">2026년 연간 원유 공급 평균 감소율 (IEA 5월 보고서)</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
