<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 2/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="summary">
      <div class="summary__head">
        <div class="summary__title">한눈에 보기</div>
        <div class="summary__date">2026.05.18.</div>
      </div>

      <div class="summary__list">
        <div class="stat">
          <div class="num-chip">01</div>
          <div class="stat__body">
            <div class="stat__label">은 하루 낙폭</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">-10.6%</span></span>
              <span class="delta">5/15 기준, $87대 → $77.52 단 하루 만에</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">02</div>
          <div class="stat__body">
            <div class="stat__label">금 하루 낙폭</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">-1.83%</span></span>
              <span class="delta">$4,564 마감 · 1월 최고가 대비 -18%</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">03</div>
          <div class="stat__body">
            <div class="stat__label">나스닥 하락률</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">-1.54%</span></span>
              <span class="delta">S&P 500 -1.24%, 다우 -1.07% 동반 (5/15)</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">04</div>
          <div class="stat__body">
            <div class="stat__label">미국 10년물 국채 금리</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">4.54%</span></span>
              <span class="delta">약 1년 내 최고치 · 달러 3월 이후 연속 강세</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
