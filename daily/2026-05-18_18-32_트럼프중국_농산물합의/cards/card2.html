<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>트럼프-중국 농산물 합의 2/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="summary">
      <div class="summary__head">
        <div class="summary__title">한눈에 보기</div>
        <div class="summary__date">2026.05.18.</div>
      </div>

      <div class="summary__list">
        <div class="stat">
          <div class="num-chip">01</div>
          <div class="stat__body">
            <div class="stat__label">미 발표 농산물 약속</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">$17B/년</span></span>
              <span class="delta">2026~2028 매년</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">02</div>
          <div class="stat__body">
            <div class="stat__label">보잉 항공기 구매</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">200대</span></span>
              <span class="delta">시장 기대치 500대 대비 미달</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">03</div>
          <div class="stat__body">
            <div class="stat__label">중국 공식 발표</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">수치 부재</span></span>
              <span class="delta">구체 금액·기간 미언급</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">04</div>
          <div class="stat__body">
            <div class="stat__label">관세 인하 검토</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">$30B 규모</span></span>
              <span class="delta">로이터 보도, 미국측 미언급</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
