<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>트럼프-중국 농산물 합의 3/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="point">
      <div class="point__date">배경</div>
      <div class="point__page">2026.05.18</div>

      <div class="point__title">
        <div class="accent-bar"></div>
        <span>왜 이 합의가 <span class="hl">나왔나</span></span>
      </div>

      <div class="point__list">
        <div class="point__item">
          <div class="point__main">
            <span class="hl">2025년부터</span> 미중 관세 갈등이<br/>
            반도체·전기차·AI 전반으로 확대됐다
          </div>
          <div class="point__sub">미국은 중국산에 최고 145% 관세,<br/>중국은 보복 관세로 대응해 교역량이 급감했다</div>
        </div>

        <div class="point__item">
          <div class="point__main">
            중동 전쟁발 <span class="hl">에너지 충격</span>이 겹치며<br/>
            양국 모두 경제 압박을 받았다
          </div>
          <div class="point__sub">유가 50%+ 급등으로 미국 물가 상승, 중국은 수출 둔화·소비 부진</div>
        </div>

        <div class="point__item">
          <div class="point__main">
            <span class="hl">9년 만의 베이징 정상회담</span><br/>
            (5월 13~14일) 합의가 핵심
          </div>
          <div class="point__sub">트럼프 "무역 적자 해소", 시진핑 "관세 인하"가 양측 목표였다</div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
