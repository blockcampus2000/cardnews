<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>트럼프-중국 농산물 합의 4/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="point">
      <div class="point__date">현재 상황</div>
      <div class="point__page">2026.05.18</div>

      <div class="point__title">
        <div class="accent-bar"></div>
        <span>지금 <span class="hl">어떻게 진행 중</span></span>
      </div>

      <div class="point__list">
        <div class="point__item">
          <div class="point__main">
            백악관 fact sheet는<br/>
            <span class="hl">$17B/년·200대·희토류</span>를 명시
          </div>
          <div class="point__sub">중국이 2026~2028 매년 농산물 $17B 구매, 보잉 200대 발주,<br/>희토류 공급망 협력 등이 공식 문서에 기재됐다</div>
        </div>

        <div class="point__item">
          <div class="point__main">
            중국 상무부 발표는<br/>
            <span class="hl">구체 수치가 빠졌다</span>
          </div>
          <div class="point__sub">항공기·원유 부분은 일부 인정하되 농산물 $17B·기간은 언급 없음.<br/>관세 인하 협의가 이뤄졌다는 표현만 사용했다</div>
        </div>

        <div class="point__item">
          <div class="point__main">
            <span class="hl">공동성명은 채택되지 않았다</span><br/>
            (9년 만의 정상회담)
          </div>
          <div class="point__sub">양측 발표 차이로 공동 문서 없이 트럼프는 5월 15일 베이징을 떠났다</div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
