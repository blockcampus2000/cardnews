<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>트럼프-중국 농산물 합의 5/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="point">
      <div class="point__date">시장·경제 영향</div>
      <div class="point__page">2026.05.18</div>

      <div class="point__title">
        <div class="accent-bar"></div>
        <span>어디에, <span class="hl">어떻게 영향</span></span>
      </div>

      <div class="point__list">
        <div class="point__item">
          <div class="point__main">
            대두 선물 가격이 <span class="hl">하락</span>하며<br/>
            농산물 시장에 실망 매물이 나왔다
          </div>
          <div class="point__sub">트럼프 발표 직후 일시 상승했으나, 중국 공식 발표에 대두 언급이 빠지자 반락했다</div>
        </div>

        <div class="point__item">
          <div class="point__main">
            보잉 주가는 <span class="hl">-3.8% 기록</span><br/>
            (시장 기대 500대 대비 200대)
          </div>
          <div class="point__sub">사전 시장 기대치는 500대였으나 200대 발표에 매도세가 나왔다고 집계됐다</div>
        </div>

        <div class="point__item">
          <div class="point__main">
            <span class="hl">달러 인덱스 소폭 강세</span>,<br/>
            위안화는 약세 흐름 유지
          </div>
          <div class="point__sub">관세 구조가 명확히 변경되지 않아 무역 협상 진전 여부가 환율 변동의 핵심 변수로 거론됐다</div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
