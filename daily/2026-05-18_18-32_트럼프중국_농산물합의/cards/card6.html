<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>트럼프-중국 농산물 합의 6/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="point">
      <div class="point__date">관전 포인트</div>
      <div class="point__page">2026.05.18</div>

      <div class="point__title">
        <div class="accent-bar"></div>
        <span>앞으로 <span class="hl">어떻게 봐야 하나</span></span>
      </div>

      <div class="point__list">
        <div class="point__item">
          <div class="point__main">
            <span class="hl">공식 계약 문서화 시점</span>이<br/>
            가장 먼저 확인될 지표
          </div>
          <div class="point__sub">트럼프측 발표와 중국 발표 간극이 좁혀지는 시점이 실질 합의 가능자로 자주 언급된다</div>
        </div>

        <div class="point__item">
          <div class="point__main">
            <span class="hl">145% 관세 단계적 인하</span> 여부와<br/>
            추가 실무 협상 일정이 주목된다
          </div>
          <div class="point__sub">미 재무장관 베센트와 중국 상무부 간 후속 실무 협의 가능성이 거론된다</div>
        </div>

        <div class="point__item">
          <div class="point__main">
            "성과 없다" vs "단기 안정 효과"<br/>
            <span class="hl">전문가 평가가 갈린다</span>
          </div>
          <div class="point__sub">전직 무역 협상가들은 "구체 성과 없음", 일부 분석은 "긴장 완화 시작점"으로 본다.<br/>대만·이란 연계 쟁점이 추가 변수로 작용 가능</div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
