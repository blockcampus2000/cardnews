<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 2/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="summary">
      <div class="summary__head">
        <div class="summary__title">한눈에 보기</div>
        <div class="summary__date">2026.05.18.</div>
      </div>

      <div class="summary__list">
        <div class="stat">
          <div class="num-chip">01</div>
          <div class="stat__body">
            <div class="stat__label">보잉 항공기 구매 합의</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">200대</span></span>
              <span class="delta">예상(500대)의 40% 수준 · 보잉 주가 -4%</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">02</div>
          <div class="stat__body">
            <div class="stat__label">미국산 농산물 연간 구매</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">170억$</span></span>
              <span class="delta">백악관 발표, 대두·옥수수·에너지 포함</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">03</div>
          <div class="stat__body">
            <div class="stat__label">희토류 수출규제 유예</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">1년 연장</span></span>
              <span class="delta">2025 부산 합의 이어 추가 연장 · 근본 해결은 미뤄짐</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">04</div>
          <div class="stat__body">
            <div class="stat__label">신설 협의체</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">2개</span></span>
              <span class="delta">무역위원회 + 투자위원회 · 관세 구체 수치는 미공개</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
