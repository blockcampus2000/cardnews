<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 2/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="summary">
      <div class="summary__head">
        <div class="summary__title">한눈에 보기</div>
        <div class="summary__date">2026.05.19.</div>
      </div>

      <div class="summary__list">
        <div class="stat">
          <div class="num-chip">01</div>
          <div class="stat__body">
            <div class="stat__label">푸틴 베이징 방문 일정</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">5/19~20</span></span>
              <span class="delta">선린우호조약 25주년 기념 · 트럼프 방중 5일 후</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">02</div>
          <div class="stat__body">
            <div class="stat__label">서명 예정 협정 건수</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">40건</span></span>
              <span class="delta">에너지·무역·기술·금융·안보 포괄</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">03</div>
          <div class="stat__body">
            <div class="stat__label">2025년 러-중 교역액</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">2340억$</span></span>
              <span class="delta">미중 교역 4,147억$ 대비 57% 수준</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">04</div>
          <div class="stat__body">
            <div class="stat__label">중국의 미·러 연속 초청</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">5일</span></span>
              <span class="delta">트럼프 5/14~15, 푸틴 5/19~20 · 이례적 외교 일정</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
