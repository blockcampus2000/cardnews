<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 세계 경제 뉴스 2/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--bright">
    <div class="summary">
      <div class="summary__head">
        <div class="summary__title">한눈에 보기</div>
        <div class="summary__date">2026.05.19.</div>
      </div>

      <div class="summary__list">
        <div class="stat">
          <div class="num-chip">01</div>
          <div class="stat__body">
            <div class="stat__label">실적 발표 일시</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">5/20장후</span></span>
              <span class="delta">한국시간 5월 21일(목) 새벽 · 2027 회계연도 1분기</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">02</div>
          <div class="stat__body">
            <div class="stat__label">시장 예상 매출</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">786억$</span></span>
              <span class="delta">전년 동기 대비 +80% · 역대 최대 분기 전망</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">03</div>
          <div class="stat__body">
            <div class="stat__label">데이터센터 매출 비중</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">85%대</span></span>
              <span class="delta">AI 인프라 직접 수혜 · 블랙웰 GPU 양산 확대 견인</span>
            </div>
          </div>
        </div>

        <div class="stat">
          <div class="num-chip">04</div>
          <div class="stat__body">
            <div class="stat__label">최대 불확실 변수</div>
            <div class="stat__value">
              <span class="num"><span class="hl-box">H20제한</span></span>
              <span class="delta">미국의 對中 AI 칩 수출 제한 · 중국 매출 감소 지속</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots dots--bright">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
