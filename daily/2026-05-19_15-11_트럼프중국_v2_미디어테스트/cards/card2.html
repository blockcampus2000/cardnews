<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>v2 데모 2/7</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card card--summary">
    <div class="hero">
      <img src="../images/stat.jpg" alt="" />
      <div class="hero__overlay"></div>
      <div class="hero__chip">한눈에 보기</div>
      <div class="hero__handle">@이진트</div>
      <div class="hero__source"><span class="dot"></span>2026.05.19 · 백악관 fact sheet 외</div>
    </div>

    <div class="content">
      <div class="content__eyebrow">핵심 수치 · 4가지</div>
      <div class="summary-list">
        <div class="summary-row">
          <div class="summary-row__label">미 발표 농산물 약속</div>
          <div class="summary-row__value"><span class="hl">$17B/년</span></div>
          <div class="summary-row__note">2026~2028 매년</div>
        </div>
        <div class="summary-row">
          <div class="summary-row__label">보잉 항공기 구매</div>
          <div class="summary-row__value"><span class="hl">200대</span></div>
          <div class="summary-row__note">기대치 500대 대비 미달</div>
        </div>
        <div class="summary-row">
          <div class="summary-row__label">중국 공식 발표</div>
          <div class="summary-row__value"><span class="hl">수치 부재</span></div>
          <div class="summary-row__note">금액·기간 미언급</div>
        </div>
        <div class="summary-row">
          <div class="summary-row__label">관세 인하 검토</div>
          <div class="summary-row__value"><span class="hl">$30B 규모</span></div>
          <div class="summary-row__note">로이터 보도, 미국측 미언급</div>
        </div>
      </div>
    </div>

    <div class="dots">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
