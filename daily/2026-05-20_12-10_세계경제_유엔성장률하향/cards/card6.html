<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><title>6/10</title><link rel="stylesheet" href="style.css"/></head>
<body>
<div class="card card--vs">
  <div class="hero">
    <video src="../videos/stat4.mp4" autoplay muted loop playsinline></video>
    <div class="hero__overlay"></div>
    <div class="hero__chip">#05 비교</div>
    <div class="hero__handle">@이진트</div>
    <div class="hero__source"><span class="dot"></span>두 갈래 시나리오 비교</div>
  </div>
  <div class="content">
    <div class="vs__title">기준 vs 악화 시나리오</div>

      </div>
      <div class="vs-divider">vs</div>
      <div class="vs-col vs-col--bad">
        <div class="vs-col__chip">악화</div>

        <div class="vs-col__desc">코로나·금융위기 외<br/>금세기 최저 수준</div>
      </div>
    </div>
    <div class="vs__footer"><strong>0.4%p</strong> 차이지만, 글로벌 GDP에서는<br/>수십조 원 규모의 영향으로 환산돼요.</div>
  </div>
  <div class="dots dots--bright"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
