<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><title>8/10</title><link rel="stylesheet" href="style.css"/></head>
<body>
<div class="card card--chart">
  <div class="hero">
    <video src="../videos/stat2.mp4" autoplay muted loop playsinline></video>
    <div class="hero__overlay"></div>
    <div class="hero__chip">#07 시각화</div>
    <div class="hero__handle">@이진트</div>
    <div class="hero__source"><span class="dot"></span>지역별 격차 한눈에</div>
  </div>
  <div class="content">
    <div class="chart__title">서아시아만 −2.2%p,<br/>지역 충격이 크게 갈렸다</div>
    <div class="chart__sub">유엔 WESP 2026 중간 업데이트 · 단위: 2026년 성장률 전망</div>
    <div class="chart-bars">
      <div class="chart-row">
        <div class="chart-row__label">개발도상국</div>
        <div class="chart-row__track"><div class="chart-row__fill" style="width:84%"></div></div>
        <div class="chart-row__value">+5.2%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">2027 회복</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:48%"></div></div>
        <div class="chart-row__value">+2.8%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">세계 전체</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:42%"></div></div>
        <div class="chart-row__value">+2.5%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">악화 시나리오</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:34%"></div></div>
        <div class="chart-row__value">+2.1%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">서아시아</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:22%"></div></div>
        <div class="chart-row__value">+1.4%</div>
      </div>
    </div>
    <div class="chart__footer">개도국 인플레는 +5.2%로 가장 가파르고, 서아시아 성장률은 1.4%로 가장 낮아졌어요.</div>
  </div>
  <div class="dots dots--bright"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
</div></body></html>
