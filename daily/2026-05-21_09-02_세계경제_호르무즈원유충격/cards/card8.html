<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><title>8/10</title><link rel="stylesheet" href="style.css"/></head>
<body>
<div class="card card--chart">
  <div class="hero">
    <video src="../videos/stat4.mp4" autoplay muted loop playsinline></video>
    <div class="hero__overlay"></div>
    <div class="hero__chip">#07 시각화</div>
    <div class="hero__handle">@이진트</div>
    <div class="hero__source"><span class="dot"></span>국가별 호르무즈 의존도</div>
  </div>
  <div class="content">
    <div class="chart__title">한국은 원유 수입의<br/><span class="hl">66%</span>가 호르무즈 의존</div>
    <div class="chart__sub">주요국 원유 수입에서 호르무즈 통과 비중 · 2026년 5월</div>
    <div class="chart-bars">
      <div class="chart-row">
        <div class="chart-row__label">일본</div>
        <div class="chart-row__track"><div class="chart-row__fill" style="width:85%"></div></div>
        <div class="chart-row__value">85%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">한국</div>
        <div class="chart-row__track"><div class="chart-row__fill" style="width:66%"></div></div>
        <div class="chart-row__value">66%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">중국</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:47%"></div></div>
        <div class="chart-row__value">47%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">인도</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:38%"></div></div>
        <div class="chart-row__value">38%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">EU 평균</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:22%"></div></div>
        <div class="chart-row__value">22%</div>
      </div>
    </div>
    <div class="chart__footer">한국은 일본 다음으로 의존도 높아 충격이 가장 큰 그룹이에요.</div>
  </div>
  <div class="dots dots--bright"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
</div></body></html>
