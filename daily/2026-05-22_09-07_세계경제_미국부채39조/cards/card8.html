<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><title>8/10</title><link rel="stylesheet" href="style.css"/></head>
<body>
<div class="card card--chart">
  <div class="hero">
    <video src="../videos/v8.mp4" autoplay muted loop playsinline></video>
    <div class="hero__overlay"></div>
    <div class="hero__chip">#06 시각화</div>
    <div class="hero__handle">@이진트</div>
    <div class="hero__source"><span class="dot"></span>주요국 공공부채/GDP 비율</div>
  </div>
  <div class="content">
    <div class="chart__title">미국, <span class="hl">100% 돌파</span>로<br/>선진국 중위권 진입</div>
    <div class="chart__sub">주요국 공공부채/GDP 비율 · 2026년 기준</div>
    <div class="chart-bars">
      <div class="chart-row">
        <div class="chart-row__label">일본</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:100%"></div></div>
        <div class="chart-row__value">260%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">이탈리아</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:52%"></div></div>
        <div class="chart-row__value">135%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">프랑스</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:43%"></div></div>
        <div class="chart-row__value">112%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">미국</div>
        <div class="chart-row__track"><div class="chart-row__fill" style="width:39%"></div></div>
        <div class="chart-row__value">100%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">한국</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:21%"></div></div>
        <div class="chart-row__value">55%</div>
      </div>
    </div>
    <div class="chart__footer">미국은 2026년 3월 처음 100%를 넘었어요.<br/>한국(55%)은 낮지만 상승세가 이어지고 있어요.</div>
  </div>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
</div>
</body></html>
