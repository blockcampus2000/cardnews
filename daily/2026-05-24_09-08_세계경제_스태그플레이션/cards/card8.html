<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><title>8/10</title><link rel="stylesheet" href="style.css"/></head>
<body>
<div class="card card--chart">
  <div class="hero">
    <video src="../videos/v8.mp4" autoplay muted loop playsinline></video>
    <div class="hero__overlay"></div>
    <div class="hero__chip">#06 시각화</div>
    <div class="hero__handle">@이진트</div>
    <div class="hero__source"><span class="dot"></span>주요국 기준금리 비교</div>
  </div>
  <div class="content">
    <div class="chart__title">미국 5.5%,<br/><span class="hl">인상 여력이 없어진다</span></div>
    <div class="chart__sub">주요국 기준금리 현황 · 2026년 5월 기준</div>
    <div class="chart-bars">
      <div class="chart-row">
        <div class="chart-row__label">미국 Fed</div>
        <div class="chart-row__track"><div class="chart-row__fill" style="width:100%"></div></div>
        <div class="chart-row__value">5.50%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">영국 BoE</div>
        <div class="chart-row__track"><div class="chart-row__fill" style="width:95%"></div></div>
        <div class="chart-row__value">5.25%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">호주 RBA</div>
        <div class="chart-row__track"><div class="chart-row__fill" style="width:79%"></div></div>
        <div class="chart-row__value">4.35%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">유럽 ECB</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:73%"></div></div>
        <div class="chart-row__value">4.00%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">일본 BOJ</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:14%"></div></div>
        <div class="chart-row__value">0.75%</div>
      </div>
    </div>
    <div class="chart__footer">금리가 이미 높은 미국·영국은 추가 인상 시 경기침체 위험이 커요.<br/>반면 일본은 금리 방어 여력이 상대적으로 남아 있어요.</div>
  </div>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
</div>
