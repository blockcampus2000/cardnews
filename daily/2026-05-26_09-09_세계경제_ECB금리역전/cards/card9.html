<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><title>9/10</title><link rel="stylesheet" href="style.css"/></head>
<body>
<div class="card card--checklist">
  <div class="hero">
    <video src="../videos/v9.mp4" autoplay muted loop playsinline></video>
    <div class="hero__overlay"></div>
    <div class="hero__chip">#07 관전</div>
    <div class="hero__handle">@이진트</div>
    <div class="hero__source"><span class="dot"></span>앞으로 봐야 할 3가지</div>
  </div>
  <div class="content">
    <div class="check__title"><span class="hl">3가지 분기점</span>이<br/>ECB 향방을 가른다</div>
    <div class="check-list">
      <div class="check-item">
        <div class="check-item__num">1</div>
        <div class="check-item__body">
          <div class="check-item__head"><strong>6월 인상 여부 확인</strong></div>
          <div class="check-item__sub">실제 인상이 이뤄지면 유럽 긴축 재개가 공식 확인돼요. 시장 반응이 즉각적으로 나타날 전망이에요.</div>
        </div>
      </div>
      <div class="check-item">
        <div class="check-item__num">2</div>
        <div class="check-item__body">
          <div class="check-item__head"><strong>유로존 에너지 가격 추이</strong></div>
          <div class="check-item__sub">이란 협상 타결 시 에너지발 인플레가 해소될 수 있어요. 그러면 ECB가 인상 속도를 조절할 가능성이 있어요.</div>
        </div>
      </div>
      <div class="check-item">
        <div class="check-item__num">3</div>
        <div class="check-item__body">
          <div class="check-item__head"><strong>EU GDP 2분기 발표</strong></div>
          <div class="check-item__sub">성장률이 0.9% 이하로 나오면 ECB가 인상 횟수를 줄이거나 속도를 늦출 수 있어요.</div>
        </div>
      </div>
    </div>
  </div>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot active"></span><span class="dot"></span></div>
</div>
