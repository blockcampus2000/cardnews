<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><title>6/10</title><link rel="stylesheet" href="style.css"/></head>
<body>
<div class="card card--vs">
  <div class="hero">
    <video src="../videos/v6.mp4" autoplay muted loop playsinline></video>
    <div class="hero__overlay"></div>
    <div class="hero__chip">시나리오 비교</div>
    <div class="hero__handle">@이진트</div>
    <div class="hero__source"><span class="dot"></span>World Bank GEP · 2026.06.11</div>
  </div>
  <div class="content">
    <div class="vs__title">글로벌 경제 향방 — <span class="hl">두 시나리오</span></div>
    <div class="vs-grid">
      <div class="vs-col vs-col--good">
        <span class="vs-col__chip">기준 시나리오</span>
        <div class="vs-col__value">2.5%</div>
        <div class="vs-col__desc">이란 분쟁 현 수준 유지<br/>유가 $94 안정화<br/>→ 2027년 2.8%로 회복<br/>→ 개도국 지원 $500~600억</div>
      </div>
      <div class="vs-divider">VS</div>
      <div class="vs-col vs-col--bad">
        <span class="vs-col__chip">위험 시나리오</span>
        <div class="vs-col__value">1.3%</div>
        <div class="vs-col__desc">에너지 공급 차단 심화<br/>금융 스트레스 동반 시<br/>→ 인플레 4.4% 폭등<br/>→ 글로벌 경기침체 진입</div>
      </div>
    </div>
    <div class="vs__footer">
      세계은행: <strong>"에너지 차단이 금융 충격으로 번질 경우 2009년 이후 최저 성장 가능"</strong><br/>무역정책 불확실성·통화긴축·기후재해가 현실화되면 추가 0.4~0.8%p 하락.
    </div>
  </div>
