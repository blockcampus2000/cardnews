<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><title>8/10</title><link rel="stylesheet" href="style.css"/></head>
<body>
<div class="card card--chart">
  <div class="hero">
    <video src="../videos/v8.mp4" autoplay muted loop playsinline></video>
    <div class="hero__overlay"></div>
    <div class="hero__chip">성장률 추이</div>
    <div class="hero__handle">@이진트</div>
    <div class="hero__source"><span class="dot"></span>World Bank · OECD · 2024~2026</div>
  </div>
  <div class="content">
    <div class="chart__title">주요 지역 2026년 성장률</div>
    <div class="chart__sub">연도별 비교 (%, 세계은행 GEP 2026.06.11)</div>
    <div class="chart-bars">
      <div class="chart-row">
        <div class="chart-row__label">인도</div>
        <div class="chart-row__track">
          <div class="chart-row__fill" style="width:100%"></div>
        </div>
        <div class="chart-row__value">6.6%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">글로벌</div>
        <div class="chart-row__track">
          <div class="chart-row__fill chart-row__fill--dim" style="width:38%"></div>
        </div>
        <div class="chart-row__value">2.5%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">유로존</div>
        <div class="chart-row__track">
          <div class="chart-row__fill chart-row__fill--dim" style="width:12%"></div>
        </div>
        <div class="chart-row__value">0.8%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">중동·걸프</div>
        <div class="chart-row__track">
          <div class="chart-row__fill chart-row__fill--dim" style="width:3%"></div>
        </div>
        <div class="chart-row__value">~0%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">위험 시나리오</div>
        <div class="chart-row__track">
          <div class="chart-row__fill chart-row__fill--dim" style="width:20%"></div>
        </div>
        <div class="chart-row__value">1.3%</div>
      </div>
    </div>
    <div class="chart__footer">개도국 3.6% (팬데믹 이후 최저) · 2027년 글로벌 2.8% 회복 전망 · 1월 전망 대비 2/3 하향</div>
  </div>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
</div>
</body></html>
