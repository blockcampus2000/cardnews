<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><title>6/10</title><link rel="stylesheet" href="style.css"/></head>
<body>
<div class="card card--vs">
  <div class="hero">
    <video src="../videos/v6.mp4" autoplay muted loop playsinline></video>
    <div class="hero__overlay"></div>
    <div class="hero__chip">비교</div>
    <div class="hero__handle">@이진트</div>
    <div class="hero__source"><span class="dot"></span>PBS · Al Jazeera · 2026.06.11</div>
  </div>
  <div class="content">
    <div class="vs__title">미국 vs 중국 — <span class="hl">각자의 득실</span></div>
    <div class="vs-grid">
      <div class="vs-col vs-col--good">
        <span class="vs-col__chip">미국</span>
        <div class="vs-col__value">30%</div>
        <div class="vs-col__desc">관세 30% 유지<br/>→ 희토류 선공급 확보<br/>→ 공급망 위기 해소<br/>→ 영구 협정 협상 주도권</div>
      </div>
      <div class="vs-divider">VS</div>
      <div class="vs-col vs-col--bad">
        <span class="vs-col__chip">중국</span>
        <div class="vs-col__value">10%</div>
        <div class="vs-col__desc">대미 관세 10% 유지<br/>→ 보복관세 105% 철회<br/>→ 수출 회복 기대<br/>→ 희토류 카드 유지</div>
      </div>
    </div>
    <div class="vs__footer">
      양측 모두 <strong>영구 합의가 아닌 60일 휴전</strong>이라는 점에 동의.<br/>협상 기한 내 합의 실패 시 고율관세 재적용 가능성 열려있다.
    </div>
  </div>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</div>
</body></html>
