<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><title>8/10</title><link rel="stylesheet" href="style.css"/></head>
<body>
<div class="card card--chart">
  <div class="hero">
    <video src="../videos/v8.mp4" autoplay muted loop playsinline></video>
    <div class="hero__overlay"></div>
    <div class="hero__chip">데이터</div>
    <div class="hero__handle">@이진트</div>
    <div class="hero__source"><span class="dot"></span>USTR · Tax Foundation · 2026.06</div>
  </div>
  <div class="content">
    <div class="chart__title">주요국 <span style="color:var(--orange-deep)">대미 관세율</span> 비교</div>
    <div class="chart__sub">2026년 6월 기준 · 미국이 각국에 부과하는 실효 관세율</div>
    <div class="chart-bars">
      <div class="chart-row">
        <div class="chart-row__label">중국</div>
        <div class="chart-row__track"><div class="chart-row__fill" style="width:82%"></div></div>
        <div class="chart-row__value">30%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">한국</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:41%"></div></div>
        <div class="chart-row__value">15%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">유럽연합</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:27%"></div></div>
        <div class="chart-row__value">10%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">일본</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:27%"></div></div>
        <div class="chart-row__value">10%</div>
      </div>
      <div class="chart-row">
        <div class="chart-row__label">최혜국(MFN)</div>
        <div class="chart-row__track"><div class="chart-row__fill chart-row__fill--dim" style="width:8%"></div></div>
        <div class="chart-row__value">~3%</div>
      </div>
    </div>
    <div class="chart__footer">
      중국은 합의 이후에도 다른 나라보다 약 2배 높은 관세율 유지.<br/>한국은 490조원(US$ 3,500억) 투자 약속으로 15% 협상 타결.
    </div>
  </div>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
</div>
</body></html>
