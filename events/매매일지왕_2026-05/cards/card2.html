<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 매매일지왕 이벤트 2/6</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="prize">
      <div class="prize__head">
        <div class="prize__eyebrow">상금 안내</div>
        <div class="prize__title">
          총 상금 <span class="accent">600 USDT</span>
        </div>
      </div>

      <div class="prize__list">
        <div class="prize__item prize__item--top">
          <div class="prize__rank">
            <div class="prize__rank-num">1</div>
            <div class="prize__rank-label">등</div>
          </div>
          <div class="prize__amount">
            <span class="num">400</span>
            <span class="unit">USDT</span>
          </div>
        </div>

        <div class="prize__item">
          <div class="prize__rank">
            <div class="prize__rank-num">2</div>
            <div class="prize__rank-label">등</div>
          </div>
          <div class="prize__amount">
            <span class="num">200</span>
            <span class="unit">USDT</span>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
