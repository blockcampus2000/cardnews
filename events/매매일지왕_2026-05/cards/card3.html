<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 매매일지왕 이벤트 3/6</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="score">
      <div class="score__head">
        <div class="score__eyebrow">평가 기준</div>
        <div class="score__title">
          어떻게 <span class="accent">점수</span>가<br/>
          매겨지나요?
        </div>
        <div class="score__total">총 100%</div>
      </div>

      <div class="score__list">
        <div class="score__item score__item--top">
          <div class="score__label">유효 매매일지 작성 갯수</div>
          <div class="score__points">
            <span class="num">50</span>
            <span class="unit">%</span>
          </div>
        </div>

        <div class="score__item">
          <div class="score__label">매매일지 누적 조회수</div>
          <div class="score__points">
            <span class="num">25</span>
            <span class="unit">%</span>
          </div>
        </div>

        <div class="score__item">
          <div class="score__label">받은 좋아요 (공감) 수</div>
          <div class="score__points">
            <span class="num">15</span>
            <span class="unit">%</span>
          </div>
        </div>

        <div class="score__item">
          <div class="score__label">받은 댓글 수</div>
          <div class="score__points">
            <span class="num">10</span>
            <span class="unit">%</span>
          </div>
        </div>
      </div>

      <div class="score__note">
        꾸준한 작성에 더해<br/>
        다른 분들이 보고 · 공감한 일지일수록 가산점
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
