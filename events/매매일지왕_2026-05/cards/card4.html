<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 매매일지왕 이벤트 4/6</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="form">
      <div class="form__head">
        <div class="form__eyebrow">필수 양식</div>
        <div class="form__title">
          유효 매매일지의<br/>
          <span class="accent">3가지 조건</span>
        </div>
      </div>

      <div class="form__list">
        <div class="form__item">
          <div class="form__num">1</div>
          <div class="form__body">
            <div class="form__label">진입 시각 + 진입봉 프레임</div>
            <div class="form__hint">예) 5분봉 · 15분봉 · 1시간봉 등</div>
          </div>
        </div>

        <div class="form__item">
          <div class="form__num">2</div>
          <div class="form__body">
            <div class="form__label">진입 근거 (관점)</div>
            <div class="form__hint">본인이 봐도, 제3자가 봐도 이해되도록</div>
          </div>
        </div>

        <div class="form__item">
          <div class="form__num">3</div>
          <div class="form__body">
            <div class="form__label">수익률 또는 수익 인증 스샷</div>
            <div class="form__hint">손실률 · 손익 인증도 포함</div>
          </div>
        </div>
      </div>

      <div class="form__minimum">
        <div class="form__minimum-tag">최소 조건</div>
        <div class="form__minimum-text">
          위 양식을 갖춘 일지 <span class="accent">10개 이상</span> 작성 시 후보 포함
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
