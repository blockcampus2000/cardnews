<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 매매일지왕 이벤트 5/6</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="rules">
      <div class="rules__head">
        <div class="rules__eyebrow">기간 · 주의사항</div>
        <div class="rules__title">
          꼭 확인해 주세요
        </div>
      </div>

      <div class="rules__period">
        <div class="rules__period-block">
          <div class="rules__period-label">이벤트 기간</div>
          <div class="rules__period-value">5월 1일 (금) ~ 5월 31일 (일)</div>
        </div>
        <div class="rules__period-divider"></div>
        <div class="rules__period-block">
          <div class="rules__period-label">당첨자 발표</div>
          <div class="rules__period-value">6월 첫 평일</div>
        </div>
      </div>

      <div class="rules__list">
        <div class="rules__item">
          <div class="rules__item-mark">1</div>
          <div class="rules__item-text">
            활동왕 · 매매일지왕 <span class="accent">중복 수상 불가</span>
          </div>
        </div>
        <div class="rules__item">
          <div class="rules__item-mark">2</div>
          <div class="rules__item-text">
            지난달 수상자는 이번 달 후보에서 제외
          </div>
        </div>
        <div class="rules__item">
          <div class="rules__item-mark">3</div>
          <div class="rules__item-text">
            도배 · 부실 작성 등 <span class="accent">어뷰징 적발 시 즉시 제외</span>
          </div>
        </div>
        <div class="rules__item">
          <div class="rules__item-mark">4</div>
          <div class="rules__item-text">
            상금 수령 후 인증 미진행 시 추후 영구 제외
          </div>
        </div>
        <div class="rules__item">
          <div class="rules__item-mark">5</div>
          <div class="rules__item-text">
            발표 후 <span class="accent">2주 이내</span> 수령 의사 미표시 시 자격 소멸
          </div>
        </div>
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
