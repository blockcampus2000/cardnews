<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 활동왕 이벤트 3/5</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="score">
      <div class="score__head">
        <div class="score__eyebrow">평가 기준</div>
        <div class="score__title">
          어떻게 <span class="accent">점수</span>가<br/>
          매겨지나요?
        </div>
        <div class="score__total">총 12점</div>
      </div>

      <div class="score__list">
        <div class="score__item score__item--top">
          <div class="score__rank">1</div>
          <div class="score__label">작성 게시글 수</div>
          <div class="score__points">
            <span class="num">6</span>
            <span class="unit">점</span>
          </div>
        </div>

        <div class="score__item">
          <div class="score__rank">2</div>
          <div class="score__label">작성 댓글 수</div>
          <div class="score__points">
            <span class="num">3</span>
            <span class="unit">점</span>
          </div>
        </div>

        <div class="score__item">
          <div class="score__rank">3</div>
          <div class="score__label">받은 좋아요 수</div>
          <div class="score__points">
            <span class="num">2</span>
            <span class="unit">점</span>
          </div>
        </div>

        <div class="score__item">
          <div class="score__rank">4</div>
          <div class="score__label">보낸 좋아요 수</div>
          <div class="score__points">
            <span class="num">1</span>
            <span class="unit">점</span>
          </div>
        </div>
      </div>

      <div class="score__note">
        다양한 카테고리에 꾸준히 글을 남길수록<br/>
        활동왕 자리는 가까워집니다
      </div>
    </div>

    <div class="brand-mark">
      <div class="brand-mark__logo">이진트</div>
    </div>

    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
