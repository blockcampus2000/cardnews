<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이진트 활동왕 이벤트 5/5</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="cta">
      <div class="cta__eyebrow">지금 참여하세요</div>

      <div class="cta__main">
        <div class="cta__headline">
          이번 달 활동왕,<br/>
          <span class="accent">당신의 차례입니다</span>
        </div>

        <div class="cta__divider"></div>

        <div class="cta__message">
          이진트 카페에서 활동하고<br/>
          <span class="accent">최대 400 USDT</span> 받아가세요
        </div>

        <div class="cta__notice">
          이진트 카페 주소는<br/>
          <span class="accent">프로필 링크</span>에서 확인하실 수 있어요
        </div>

        <div class="cta__promise">
          이 이벤트는 <span class="accent">매월 진행</span>되며,<br/>
          상금 규모는 <span class="accent">점진적으로 우상향</span>합니다
        </div>
      </div>
    </div>

    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot active"></span>
    </div>
  </div>
</body>
</html>
